[package]
name = "DRVFuzz"
version = "0.1.0"
edition = "2024"
default-run = "DRVFuzz"
autobins = false

[[bin]]
name = "DRVFuzz"
path = "src/main.rs"

[[bin]]
name = "bug_localization_time"
path = "src/bin/bug_localization_time.rs"

[[bin]]
name = "cva6_spike_overhead_timeboxed"
path = "src/bin/cva6_spike_overhead_timeboxed.rs"

[[bin]]
name = "rocket_spike_overhead_timeboxed"
path = "src/bin/rocket_spike_overhead_timeboxed.rs"

[[bin]]
name = "rocket_spike_time_stats"
path = "src/bin/rocket_spike_time_stats.rs"

[features]
integration-tests = []

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
log = "0.4.28"
once_cell = "1.21.3"
rand = "0.9.2"
regex = "1.12.2"
riscv-instruction = { path = "../riscv-instruction-crates/riscv-instruction" }
riscv-instruction-types = { path = "../riscv-instruction-crates/riscv-instruction-types" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "2.0.17"
toml = "0.9.8"
env_logger = "0.11.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.23.0"
which = "8.0.0"
